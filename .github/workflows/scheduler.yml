# Scheduler externo: Render free duerme el servicio, así que los trabajos periódicos
# los dispara GitHub Actions contra endpoints protegidos con X-Cron-Key.
# Requiere: secret CRON_API_KEY (= Cron__ApiKey en Render) y variable API_BASE_URL.
name: scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
    steps:
      - name: Wake up the API
        run: curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${API_BASE_URL%/api/v1}/health"

      - name: Expire unpaid bookings (US-07)
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 -X POST -H "X-Cron-Key: ${CRON_API_KEY}" "${API_BASE_URL}/bookings/expire-pending"

      - name: Alert rooms in maintenance over 24 h (US-06)
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 -X POST -H "X-Cron-Key: ${CRON_API_KEY}" "${API_BASE_URL}/rooms/maintenance-alerts"

      - name: Follow up demo requests (US-27)
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 -X POST -H "X-Cron-Key: ${CRON_API_KEY}" "${API_BASE_URL}/demo-requests/follow-ups"
