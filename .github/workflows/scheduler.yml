# Scheduler externo: los trabajos periódicos los dispara GitHub Actions contra endpoints protegidos con X-Cron-Key,
# a través del API gateway (que los enruta al servicio dueño de cada uno). Los e-mails ya no necesitan un job:
# los entrega el notifications-worker en cuanto llegan a RabbitMQ.
# Requiere: secret CRON_API_KEY (= Cron__ApiKey de los servicios) y variable API_BASE_URL (URL del gateway + /api/v1).
name: scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
    steps:
      - name: Wake up the API
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${API_BASE_URL%/api/v1}/health"

      - name: Expire unpaid bookings
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 -X POST -H "X-Cron-Key: ${CRON_API_KEY}" "${API_BASE_URL}/bookings/expire-pending"

      - name: Alert rooms in maintenance over 24 h
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 -X POST -H "X-Cron-Key: ${CRON_API_KEY}" "${API_BASE_URL}/rooms/maintenance-alerts"

      - name: Follow up demo requests
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 -X POST -H "X-Cron-Key: ${CRON_API_KEY}" "${API_BASE_URL}/demo-requests/follow-ups"
