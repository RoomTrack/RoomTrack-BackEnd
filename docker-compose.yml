# Local development stack: API + MySQL 8.
#   cp .env.example .env   # optional; without .env the Development defaults below are used
#   docker compose up -d --build
#   curl http://localhost:10000/health
# Swagger UI: http://localhost:10000/
name: smartstay

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartstay_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartstay}
      MYSQL_USER: ${MYSQL_USER:-smartstay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartstay_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-10000}:10000"
    # Optional .env: TokenSettings__*, InitialChainAdmin__*, Cors__AllowedOrigins, Redis/ActiveMQ...
    env_file:
      - path: .env
        required: false
    environment:
      # Development uses the local-only JWT secret and CORS defaults from appsettings.Development.json.
      # Set ASPNETCORE_ENVIRONMENT=Production in .env to test production settings (TokenSettings__Secret required).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Inside compose the connection string always points at the mysql service above.
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;user=${MYSQL_USER:-smartstay};password=${MYSQL_PASSWORD:-smartstay_dev};database=${MYSQL_DATABASE:-smartstay};"
    restart: unless-stopped

volumes:
  mysql-data:
