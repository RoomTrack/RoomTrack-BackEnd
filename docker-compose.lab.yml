# Resilience lab (course experiment): 2 API replicas behind nginx + Redis circuit breaker + ActiveMQ fallback.
# Not needed for normal development; use docker-compose.yml instead.
#   LAB_DB_CONNECTION="server=host.docker.internal;port=3306;user=...;password=...;database=...;" \
#   TokenSettings__Secret=... docker compose -f docker-compose.lab.yml up -d --build
services:

  backend-primary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-primary
    ports:
      - "5001:10000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${LAB_DB_CONNECTION:?set LAB_DB_CONNECTION (MySQL on the host)}
      ConnectionStrings__RedisConnection: "host.docker.internal:6379"
      Messaging__ActiveMqBrokerUri: "tcp://activemq:61616"
      TokenSettings__Secret: ${TokenSettings__Secret:?set TokenSettings__Secret}
    depends_on:
      - activemq
    restart: always

  backend-secondary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-secondary
    ports:
      - "5002:10000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${LAB_DB_CONNECTION:?set LAB_DB_CONNECTION (MySQL on the host)}
      ConnectionStrings__RedisConnection: "host.docker.internal:6379"
      Messaging__ActiveMqBrokerUri: "tcp://activemq:61616"
      TokenSettings__Secret: ${TokenSettings__Secret:?set TokenSettings__Secret}
    depends_on:
      - activemq
    restart: always

  activemq:
    image: apache/activemq-classic:latest
    container_name: activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-primary
      - backend-secondary
    restart: always